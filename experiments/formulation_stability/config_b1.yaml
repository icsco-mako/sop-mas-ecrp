# Formulation Stability — Batch 1 (pilot)
# deepseek-v4-flash + thinking mode, 15 repeats.
# Note: this batch shows lower AR (33%) than b2/b3 due to API/model drift.

llm:
  client: DeepSeek
  model: deepseek-v4-flash

pipeline:
  algorithm: sop_mac
  max_collaborate_nums: 5
  is_backtrack: false
  thinking: enabled

configs:
  - {id: b1_v4flash, top_p: 1.0, temperature: 0.2}

creative_agents: [ModelEngineer, PythonDeveloper]
repeats: 15

instances:
  - {dataset: NLP4ECR, prob_name: prob_empirical}

output_root: results/formulation_stability
concurrency: 4
timeout_sec: 1800
